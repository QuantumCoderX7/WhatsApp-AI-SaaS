version: '3.8'

services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: whatsapp_saas_api
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/whatsapp_saas
      - SYNC_DATABASE_URL=postgresql+psycopg2://postgres:postgres@db:5432/whatsapp_saas
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis
    volumes:
      - ./backend:/app

  db:
    image: ankane/pgvector:latest
    container_name: whatsapp_saas_db
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=whatsapp_saas
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: whatsapp_saas_redis
    ports:
      - "6379:6379"

volumes:
  pgdata:
